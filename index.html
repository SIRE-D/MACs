  if (st || ios) h.classList.add("app-inst");
  if (ios) h.classList.add("app-ios");
})();

<!-- 2) Íconos y manifest: se generan DESPUÉS del primer dibujo para no retrasar el arranque -->
<script>
(function () {
  var PWA = {
    nombre:       "MACs+",     // nombre bajo el ícono al instalar
    color1:       "#3f31dc",    // degradado del ícono: esquina superior izquierda (violeta)
    colorMedio:   "#2a60c8",    // degradado del ícono: centro (azul)
    color2:       "#1f88ae",    // degradado del ícono: esquina inferior derecha (turquesa)
    colorVentana: "#3b45d3",    // reflejo azul dentro de las cápsulas
    fondoApp:     "#020617",    // color de la pantalla de arranque de la app
    fondoArranque:"#020617"     // fondo del arranque nativo de Android: NEGRO (el ícono redondo "any" tiene esquinas transparentes, así solo se ve el círculo)
  };

  // ---- Dibuja el ícono (dos cápsulas de medicamento) y lo devuelve como imagen PNG ----
  function icono(px, forma, glifo) {
    var c = document.createElement("canvas"); c.width = c.height = px;
    var x = c.getContext("2d"), k = px / 512;
    x.scale(k, k);
    if (forma === "mascara") {   // maskable: círculo sobre el MISMO negro del arranque nativo (así, aunque Android use este ícono en el arranque, no se ve ningún cuadro)
      x.fillStyle = PWA.fondoArranque; x.fillRect(0, 0, 512, 512);
      x.translate(256, 256); x.scale(.88, .88); x.translate(-256, -256);
      forma = "circulo";
    }
    var g = x.createLinearGradient(0, 0, 512, 512);
    g.addColorStop(0, PWA.color1); g.addColorStop(.5, PWA.colorMedio); g.addColorStop(1, PWA.color2);
    x.fillStyle = g; x.beginPath();
    if (forma === "circulo") {
      x.arc(256, 256, 256, 0, Math.PI * 2); x.closePath();
    } else { x.rect(0, 0, 512, 512); }
    x.fill();
    x.translate(256, 256); x.scale(glifo, glifo); x.translate(-256, -256);
    function rr(a, b, w, h, r) { x.beginPath(); if (x.roundRect) x.roundRect(a, b, w, h, r); else x.rect(a, b, w, h); }
    function capsula(cx, cy, ang) {
      x.save(); x.translate(cx, cy); x.rotate(ang * Math.PI / 180);
      x.fillStyle = "#fff"; rr(-48, -101, 96, 202, 48); x.fill();
      x.fillStyle = PWA.colorVentana; rr(-21, -78, 42, 60, 21); x.fill();
      x.restore();
    }
    capsula(178, 255, 0);      // cápsula vertical
    capsula(310, 259, -40);    // cápsula inclinada
    return c.toDataURL("image/png");
  }

  function link(rel, href) { var l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); }

  // AYUDANTE PARA OTROS SISTEMAS: abre esta página con  #icono  al final de la dirección
  if (location.hash === "#icono") {
    window.addEventListener("load", function () {
      var t = document.createElement("textarea");
      t.value = '<link rel="apple-touch-icon" href="' + icono(180, "cuadrado", .92) + '">';
      t.style.cssText = "position:fixed;z-index:99;left:8px;right:8px;top:8px;height:40vh;background:#fff;color:#000;font:12px monospace";
      document.body.appendChild(t); t.select();
    });
  }

  function montar() {
    try {
      var base = location.origin + location.pathname;
      var carpeta = base.replace(/[^\/]*$/, "");
      // maskable = círculo sobre el mismo negro del arranque (sin cuadro visible); 'any' = círculo con esquinas transparentes
      var i192 = icono(192, "circulo", 1.05), i512 = icono(512, "circulo", 1.05), imask = icono(512, "mascara", 1.05);
      var manifest = {
        id: base, name: PWA.nombre, short_name: PWA.nombre, lang: "es",
        start_url: base, scope: carpeta, display: "standalone", orientation: "portrait",
        background_color: PWA.fondoArranque, theme_color: PWA.fondoApp,
        icons: [
          { src: i192, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: i512, sizes: "512x512", type: "image/png", purpose: "any" },
          { src: imask, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      link("manifest", URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })));
    } catch (e) { /* si algo falla, la página web sigue funcionando igual */ }
  }
  function tarde() { requestAnimationFrame(function () { setTimeout(montar, 50); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tarde); else tarde();
})();
</script>

<style>
  :root{--cy:#22d3ee;--az:#2563eb;--vi:#8b5cf6;--fondo:#020617}
  html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  /* Alto del pie de marca: franja de contenido + zona segura inferior (iPhone). Android = 0 de zona segura. */
  :root{--pie-txt:30px;--pie-h:calc(var(--pie-txt) + env(safe-area-inset-bottom,0px))}
  /* Marco del sistema: ahora TERMINA donde empieza el pie, así el menú flotante de la app
     queda siempre por encima del pie, sin que nada lo tape ni lo roce. */
  #marco{position:fixed;top:0;left:0;right:0;bottom:var(--pie-h);background:var(--fondo)}
  /* iPhone instalado: el título baja un poco más debajo de la barra de estado / isla dinámica */
  html.app-ios #marco{top:calc(env(safe-area-inset-top,0px) + 18px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}
  #app{display:block;width:100%;height:100%;border:0;background:var(--fondo)}
  /* Pie de marca (iPhone y Android): ocupa la franja inferior completa, incluida la zona segura = sin línea negra */
  #pieSired{position:fixed;left:0;right:0;bottom:0;height:var(--pie-h);z-index:3;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,#06102e 0%,#020617 100%);font-family:'Orbitron',system-ui,sans-serif}
  #pieSired canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #pieSired .cont{position:absolute;left:0;right:0;top:0;height:var(--pie-txt);display:flex;align-items:center;justify-content:center;gap:10px}
  #pieSired .cont::before{content:"";position:absolute;left:50%;top:50%;width:min(86%,300px);height:22px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(2,6,23,.92) 0%,rgba(2,6,23,.82) 45%,rgba(2,6,23,0) 100%)}
  /* Línea divisoria app/pie: filamento tenue + haz de energía que la recorre + resplandor hacia arriba */
  #pieSired .lin{position:absolute;left:0;right:0;top:0;height:2px;z-index:2;
    background:linear-gradient(90deg,rgba(34,211,238,.15),rgba(99,102,241,.55),rgba(34,211,238,.15));overflow:hidden}
  #pieSired .lin::before{content:"";position:absolute;top:0;left:-35%;width:35%;height:100%;
    background:linear-gradient(90deg,transparent,#67e8f9 45%,#fff 55%,#a78bfa,transparent);
    filter:drop-shadow(0 0 4px #22d3ee);animation:haz 2.8s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes haz{to{left:100%}}
  #pieSired .res{position:absolute;left:0;right:0;top:0;height:14px;z-index:1;
    background:linear-gradient(180deg,rgba(34,211,238,.16),transparent);animation:resp 2.8s ease-in-out infinite}
  @keyframes resp{50%{opacity:.45}}
  #pieSired .pt{position:relative;width:6px;height:6px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;animation:ptPie 1.2s ease-in-out infinite}
  #pieSired .pt:last-child{animation-delay:.6s;background:#8b5cf6;box-shadow:0 0 10px #8b5cf6}
  @keyframes ptPie{50%{transform:scale(1.7);opacity:.5}}
  #pieSired .tx{position:relative;font-size:10px;font-weight:800;letter-spacing:.32em;padding-left:.34em;color:transparent;white-space:nowrap;
    background:linear-gradient(100deg,#a5f3fc,#22d3ee,#3b82f6,#8b5cf6,#e9d5ff,#22d3ee);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;animation:flujoPie 3.5s linear infinite;filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}
  @keyframes flujoPie{to{background-position:-250% 0}}
  @media (max-width:340px){#pieSired .tx{font-size:10px;letter-spacing:.24em}}
  @media (prefers-reduced-motion:reduce){#pieSired .lin::before,#pieSired .res,#pieSired .pt,#pieSired .tx{animation:none}}


  /* ===== PANTALLA DE CARGA ===== */
  #cargando{position:fixed;inset:0;z-index:2;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#0b1a3d 0%,#050b24 45%,#020617 100%);
    color:#e2e8f0;font-family:'Rajdhani',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    transition:opacity .7s ease,transform .7s ease,filter .7s ease}
  #cargando.salir{opacity:0;transform:scale(1.18);filter:blur(6px) brightness(1.8)}
  #fx{position:absolute;inset:0;width:100%;height:100%}
  #cargando::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}

  .escena{position:relative;width:min(92vw,620px);display:flex;flex-direction:column;align-items:center;text-align:center;z-index:1;padding-bottom:4vh}

  /* anillos holográficos */
  .anillos{position:absolute;top:50%;left:50%;width:min(88vw,540px);aspect-ratio:1;transform:translate(-50%,-62%);pointer-events:none}
  .anillos svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .a1{animation:giro 22s linear infinite}
  .a2{animation:giro 14s linear infinite reverse}
  .a3{animation:giro 36s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}
  .anillos .nucleo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.22),rgba(37,99,235,.08) 55%,transparent 70%);animation:latido 2.4s ease-in-out infinite}
  @keyframes latido{50%{transform:scale(1.12);opacity:.65}}

  /* palabra SIRED */
  .marca{position:relative;margin:0;padding:0 0 0 .2em;font-family:'Orbitron','Rajdhani',system-ui,sans-serif;font-weight:900;
    font-size:clamp(58px,19vw,138px);line-height:1;letter-spacing:.2em;text-transform:uppercase;user-select:none;
    animation:entrada 1.4s cubic-bezier(.2,.8,.2,1) both}
  .marca .txt{position:relative;display:block;color:transparent;
    background:linear-gradient(100deg,#a5f3fc 0%,#22d3ee 22%,#3b82f6 50%,#8b5cf6 78%,#e9d5ff 100%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;animation:flujo 4s linear infinite;
    filter:drop-shadow(0 0 14px rgba(34,211,238,.55)) drop-shadow(0 0 38px rgba(59,130,246,.45))}
  @keyframes flujo{to{background-position:-220% 0}}
  .marca::before,.marca::after{content:attr(data-t);position:absolute;inset:0;padding-left:.2em;mix-blend-mode:screen;pointer-events:none;opacity:.85}
  .marca::before{color:#06b6d4;animation:glitchA 5.5s steps(1) infinite}
  .marca::after{color:#a855f7;animation:glitchB 5.5s steps(1) infinite}
  @keyframes glitchA{0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}91%{transform:translate(-5px,0);clip-path:inset(18% 0 55% 0)}93%{transform:translate(4px,0);clip-path:inset(60% 0 12% 0)}95%{transform:translate(-3px,0);clip-path:inset(35% 0 40% 0)}}
  @keyframes glitchB{0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}92%{transform:translate(5px,0);clip-path:inset(50% 0 20% 0)}94%{transform:translate(-4px,0);clip-path:inset(8% 0 70% 0)}96%{transform:translate(3px,0);clip-path:inset(72% 0 5% 0)}}
  @keyframes entrada{from{opacity:0;letter-spacing:.7em;filter:blur(14px)}to{opacity:1;letter-spacing:.2em;filter:blur(0)}}

  /* haz de escaneo sobre la palabra */
  .haz{position:absolute;left:-6%;right:-6%;height:2px;top:0;background:linear-gradient(90deg,transparent,#67e8f9,#fff,#67e8f9,transparent);
    box-shadow:0 0 18px 4px rgba(34,211,238,.7);animation:barrido 2.8s ease-in-out infinite;z-index:3}
  @keyframes barrido{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}

  /* reflejo holográfico */
  .reflejo{position:relative;width:100%;height:clamp(26px,7vw,52px);overflow:hidden;margin-top:2px;opacity:.28;
    -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
  .reflejo span{display:block;transform:scaleY(-1);transform-origin:center top;font-family:'Orbitron',system-ui,sans-serif;font-weight:900;
    font-size:clamp(58px,19vw,138px);line-height:1;letter-spacing:.2em;padding-left:.2em;color:#22d3ee;filter:blur(1.5px)}

  .lema{margin:clamp(10px,2.4vh,20px) 0 0;font-family:'Orbitron',system-ui,sans-serif;font-weight:500;font-size:clamp(9px,2.5vw,12px);
    letter-spacing:.42em;padding-left:.42em;color:#7dd3fc;opacity:.85;animation:aparece 1.6s .6s both}
  @keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:.85;transform:none}}

  /* barra de progreso */
  .panel{width:min(78vw,380px);margin-top:clamp(22px,5vh,40px);animation:aparece 1.6s .9s both}
  .barra{position:relative;height:6px;border-radius:6px;background:rgba(148,163,184,.14);overflow:hidden;
    box-shadow:0 0 0 1px rgba(34,211,238,.25),0 0 18px rgba(34,211,238,.15)}
  #relleno{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6);
    box-shadow:0 0 14px rgba(34,211,238,.9);transition:width .25s linear;position:relative}
  #relleno::after{content:"";position:absolute;top:0;right:0;width:36px;height:100%;background:linear-gradient(90deg,transparent,#fff);opacity:.9}
  .datos{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;font-weight:600;letter-spacing:.14em;color:#94a3b8}
  #estado{color:#a5f3fc;text-align:left}
  #pct{font-family:'Orbitron',system-ui,sans-serif;font-weight:500;color:#22d3ee;min-width:3.2em;text-align:right}

  #ayuda{position:relative;margin-top:16px;font-size:13px;letter-spacing:.05em;color:#94a3b8;opacity:0;transition:opacity .4s}
  #ayuda a{color:#22d3ee}

  /* esquinas HUD */
  .esq{position:absolute;width:34px;height:34px;border:2px solid rgba(34,211,238,.55);z-index:1;animation:aparece 1.2s .3s both}
  .esq.tl{top:max(18px,env(safe-area-inset-top));left:18px;border-right:0;border-bottom:0}
  .esq.tr{top:max(18px,env(safe-area-inset-top));right:18px;border-left:0;border-bottom:0}
  .esq.bl{bottom:max(18px,env(safe-area-inset-bottom));left:18px;border-right:0;border-top:0}
  .esq.br{bottom:max(18px,env(safe-area-inset-bottom));right:18px;border-left:0;border-top:0}

  @media (prefers-reduced-motion:reduce){
    .a1,.a2,.a3,.haz,.marca::before,.marca::after,.marca .txt,.anillos .nucleo{animation:none}
    .marca{animation:none}
  }

      <svg class="a2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="#3b82f6" stroke-opacity=".5" stroke-width=".7" stroke-dasharray="14 6 2 6"/><path d="M16 100a84 84 0 0 1 30-64" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/><path d="M184 100a84 84 0 0 1-30 64" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="a3" viewBox="0 0 200 200"><circle cx="100" cy="100" r="70" fill="none" stroke="#8b5cf6" stroke-opacity=".45" stroke-width=".6" stroke-dasharray="1 4"/><path d="M100 30a70 70 0 0 1 60 35" fill="none" stroke="#c4b5fd" stroke-width="1.3" stroke-linecap="round"/></svg>

<script>
  // =====================================================================
  //  ÚNICO LUGAR QUE DEBES EDITAR
  // =====================================================================

  // 1) Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec):
  var URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwYPiBy34iwhqtxn9U-XeIuOk6H5GhhGXEvrS_P4tF43wxhTuDSoHp320llYpqgEEAKyA/exec";

  // 2) Nombre que aparece en la PESTAÑA del navegador (pon el que quieras):
  var NOMBRE_PESTANA = "MACs_SD";

  // 3) Texto de la PANTALLA DE CARGA (la palabra grande y brillante):
  var TEXTO_CARGA = "SIRED";

  // 4) PIE DE MARCA (franja inferior animada):
  var PIE = {
    mostrar: true,                  // false = oculta el pie por completo
    texto:   "TECNOLOGÍA SIRED",    // texto del pie
    alto:    30                     // alto en px (sin contar la zona segura del iPhone): 24 muy fino · 30 normal · 40 grueso
  };

  // =====================================================================
  //  No toques nada de aquí para abajo
  // =====================================================================
  var $ = function (id) { return document.getElementById(id); };
  document.title = (NOMBRE_PESTANA || "").trim() || "Aplicación";
  var texto = (TEXTO_CARGA || "").trim();
  $("nombre").textContent = texto;
  $("marca").setAttribute("data-t", texto);
  $("reflejo").textContent = texto;

  /* ---------- Aplica la configuración del pie ---------- */
  (function () {
    var r = document.documentElement.style;
    if (PIE.mostrar === false) { r.setProperty("--pie-txt", "0px"); $("pieSired").style.display = "none"; return; }
    r.setProperty("--pie-txt", Math.max(18, Number(PIE.alto) || 30) + "px");
    if (PIE.texto) $("pieTxt").textContent = PIE.texto;
  })();

  /* ---------- Fondo animado: rejilla en perspectiva + partículas ---------- */
  (function () {
    var cv = $("fx"), cx = cv.getContext("2d"), W, H, DPR, t = 0, parts = [];
    var quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function medir() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
      var n = Math.round(Math.min(90, W * H / 14000));
      parts = [];
      for (var i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, v: .15 + Math.random() * .5, r: .6 + Math.random() * 1.6, c: Math.random() < .7 ? "34,211,238" : "139,92,246" });
    }
    function dibujar() {
      cx.clearRect(0, 0, W, H);
      var hz = H * .6, i, y, p;
      // líneas horizontales que avanzan hacia el espectador
      for (i = 0; i < 16; i++) {
        p = ((i + t * .012) % 16) / 16; p = p * p;
        y = hz + (H - hz) * p;
        cx.strokeStyle = "rgba(34,211,238," + (.04 + p * .32) + ")"; cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
      }
      // líneas que convergen en el horizonte
      for (i = -14; i <= 14; i++) {
        cx.strokeStyle = "rgba(99,102,241," + (.28 - Math.abs(i) * .012) + ")";
        cx.beginPath(); cx.moveTo(W / 2 + i * 14, hz); cx.lineTo(W / 2 + i * W * .16, H); cx.stroke();
      }
      // resplandor del horizonte
      var g = cx.createLinearGradient(0, hz - 60, 0, hz + 40);
      g.addColorStop(0, "rgba(34,211,238,0)"); g.addColorStop(.6, "rgba(34,211,238,.16)"); g.addColorStop(1, "rgba(34,211,238,0)");
      cx.fillStyle = g; cx.fillRect(0, hz - 60, W, 100);
      // partículas de datos
      for (i = 0; i < parts.length; i++) {
        var q = parts[i];
        if (!quieto) { q.y -= q.v; if (q.y < -4) { q.y = H + 4; q.x = Math.random() * W; } }
        cx.fillStyle = "rgba(" + q.c + "," + (.25 + .5 * Math.abs(Math.sin(t * .02 + i))) + ")";
        cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, 6.283); cx.fill();

      if (!quieto) { t++; if ($("cargando").style.display !== "none") requestAnimationFrame(dibujar); }
    }
    window.addEventListener("resize", medir);
    medir(); dibujar();
  })();

  /* ---------- Progreso y mensajes de estado ---------- */
  var progreso = 0, listo = false, cerrando = false;
  var fases = [[0, "INICIANDO NÚCLEO"], [18, "CONECTANDO SERVIDOR"], [42, "SINCRONIZANDO DATOS"], [66, "CARGANDO MÓDULOS"], [84, "CASI LISTO"], [100, "SISTEMA EN LÍNEA"]];
  function pintar() {
    var v = Math.floor(progreso), e = fases[0][1];
    for (var i = 0; i < fases.length; i++) if (v >= fases[i][0]) e = fases[i][1];
    $("relleno").style.width = progreso + "%";
    $("pct").textContent = v + "%";
    $("estado").textContent = e;
  }
  var reloj = setInterval(function () {
    if (!listo) progreso += Math.max(.08, (90 - progreso) * .025);
    else progreso = Math.min(100, progreso + 4);
    pintar();
    if (listo && progreso >= 100 && !cerrando) {
      cerrando = true; clearInterval(reloj);
      setTimeout(function () {
        var c = $("cargando"); c.classList.add("salir");
        setTimeout(function () { c.style.display = "none"; }, 750);
      }, 350);
    }
  }, 60);

  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APPS_SCRIPT)) {
    clearInterval(reloj);
    document.querySelector(".panel").style.display = "none";
    $("ayuda").innerHTML = "FALTA CONFIGURAR LA URL<br>Edita este archivo y pega la URL /exec en <b>URL_APPS_SCRIPT</b>";
    $("ayuda").style.opacity = "1";
  } else {
    // Se conserva lo que venga después del "?" (por ejemplo ?verificar=SOL-...)
    var destino = URL_APPS_SCRIPT + (location.search || "");
    var marco = $("app");
    marco.src = destino;
    $("directo").href = destino;
    marco.addEventListener("load", function () { listo = true; });
    setTimeout(function () { $("ayuda").style.opacity = "1"; }, 9000);
  }

  /* ---------- Pie de marca: circuito digital con pulsos eléctricos ---------- */
  (function () {
    var cv = $("pieFx"); if (!cv) return;
    var cx = cv.getContext("2d"), W = 0, H = 0, DPR = 1, trazos = [], pulsos = [], last = 0, corriendo = false;
    var quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var COL = ["34,211,238", "59,130,246", "139,92,246"];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function medir() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      if (!W || !H) return;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
      trazos = []; pulsos = [];
      var filas = Math.max(4, Math.round(H / 9));
      for (var r = 0; r < filas; r++) {
        var y = 4 + (H - 8) * r / (filas - 1), x = -10, pts = [[x, y]], col = COL[r % 3];
        while (x < W + 10) {
          x += rnd(18, 60); pts.push([x, y]);
          if (Math.random() < .55) {
            var dy = (Math.random() < .5 ? -1 : 1) * rnd(5, 11);
            if (y + dy < 3 || y + dy > H - 3) dy = -dy;
            x += Math.abs(dy); y += dy; pts.push([x, y]);
          }
        }
        var acum = [0], tot = 0;
        for (var i = 1; i < pts.length; i++) {
          tot += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); acum.push(tot);
        }
        trazos.push({ pts: pts, acum: acum, tot: tot, col: col });
        var n = Math.random() < .6 ? 1 : 2;
        for (var k = 0; k < n; k++) pulsos.push({ t: trazos.length - 1, s: rnd(0, tot), v: rnd(50, 130), len: rnd(24, 46) });
      }
      dibujar(0);
    }
    function punto(tr, s) {
      var a = tr.acum, i = 1;
      while (i < a.length - 1 && a[i] < s) i++;
      var f = (s - a[i - 1]) / ((a[i] - a[i - 1]) || 1);
      return [tr.pts[i - 1][0] + (tr.pts[i][0] - tr.pts[i - 1][0]) * f, tr.pts[i - 1][1] + (tr.pts[i][1] - tr.pts[i - 1][1]) * f];
    }
    function dibujar(dt) {
      cx.clearRect(0, 0, W, H);
      var i, j, tr;
      // pistas tenues + nodos
      for (i = 0; i < trazos.length; i++) {
        tr = trazos[i];
        cx.strokeStyle = "rgba(" + tr.col + ",.20)"; cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(tr.pts[0][0], tr.pts[0][1]);
        for (j = 1; j < tr.pts.length; j++) cx.lineTo(tr.pts[j][0], tr.pts[j][1]);
        cx.stroke();
        cx.fillStyle = "rgba(" + tr.col + ",.45)";
        for (j = 1; j < tr.pts.length - 1; j += 2) { cx.beginPath(); cx.arc(tr.pts[j][0], tr.pts[j][1], 1.3, 0, 6.283); cx.fill(); }
      }
      // pulsos eléctricos con estela
      for (i = 0; i < pulsos.length; i++) {
        var p = pulsos[i]; tr = trazos[p.t];
        if (!quieto) { p.s += p.v * dt; if (p.s > tr.tot + p.len) { p.s = -rnd(0, 80); p.v = rnd(50, 130); } }
        if (quieto && p.s < 0) continue;
        var pasos = 9, prev = null;
        for (j = 0; j <= pasos; j++) {
          var s = p.s - p.len * (1 - j / pasos);
          if (s < 0 || s > tr.tot) { prev = null; continue; }
          var q = punto(tr, s);
          if (prev) {
            cx.strokeStyle = "rgba(" + tr.col + "," + (.1 + .9 * j / pasos) + ")"; cx.lineWidth = 1.2 + 1.2 * j / pasos;
            cx.beginPath(); cx.moveTo(prev[0], prev[1]); cx.lineTo(q[0], q[1]); cx.stroke();
          }
          prev = q;
        }
        if (p.s >= 0 && p.s <= tr.tot) {
          var h = punto(tr, p.s);
          cx.shadowColor = "rgba(" + tr.col + ",1)"; cx.shadowBlur = 8;
          cx.fillStyle = "#e0faff"; cx.beginPath(); cx.arc(h[0], h[1], 1.8, 0, 6.283); cx.fill();
          cx.shadowBlur = 0;
        }
      }
    }
    function bucle(ts) {
      if (!corriendo) return;
      var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
      dibujar(dt); requestAnimationFrame(bucle);
    }
    function iniciar() { if (quieto || corriendo) return; corriendo = true; last = performance.now(); requestAnimationFrame(bucle); }
    document.addEventListener("visibilitychange", function () { if (document.hidden) corriendo = false; else iniciar(); });
    window.addEventListener("resize", medir);
    window.addEventListener("orientationchange", function () { setTimeout(medir, 250); });
    medir(); iniciar();
  })();
</script>
